services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PATH: /app/data/emoji-checker.db
      JWT_SECRET: ${JWT_SECRET:-replace-this-jwt-secret}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-replace-this-ai-token}
      AI_SERVICE_URL: http://ai-service:8000
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE:-change-me}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "3000:3000"
    volumes:
      - emoji-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_BACKEND_URL: http://backend:3000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-replace-this-ai-token}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.65}
      AI_SAMPLE_INTERVAL_SECONDS: ${AI_SAMPLE_INTERVAL_SECONDS:-3}
      AI_DETECTOR_BACKENDS: ${AI_DETECTOR_BACKENDS:-opencv,mtcnn}
      AI_FACE_EXPAND_PERCENTAGE: ${AI_FACE_EXPAND_PERCENTAGE:-15}
      AI_TEMPORAL_WINDOW: ${AI_TEMPORAL_WINDOW:-3}
      AI_TEMPORAL_TTL_SECONDS: ${AI_TEMPORAL_TTL_SECONDS:-15}
      AI_MIN_TEMPORAL_AGREEMENT: ${AI_MIN_TEMPORAL_AGREEMENT:-0.67}
      AI_MIN_EMOTION_MARGIN: ${AI_MIN_EMOTION_MARGIN:-0.12}
      AI_CONFUSED_MIN_MARGIN: ${AI_CONFUSED_MIN_MARGIN:-0.20}
      AI_THRESHOLD_HAPPY: ${AI_THRESHOLD_HAPPY:-0.68}
      AI_THRESHOLD_NEUTRAL: ${AI_THRESHOLD_NEUTRAL:-0.70}
      AI_THRESHOLD_CONFUSED: ${AI_THRESHOLD_CONFUSED:-0.75}
      AI_THRESHOLD_DISGUST: ${AI_THRESHOLD_DISGUST:-0.72}
      AI_THRESHOLD_ANGRY: ${AI_THRESHOLD_ANGRY:-0.70}
      AI_THRESHOLD_SAD: ${AI_THRESHOLD_SAD:-0.70}
      AI_THRESHOLD_SURPRISED: ${AI_THRESHOLD_SURPRISED:-0.70}
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  emoji-data:
